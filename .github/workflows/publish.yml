name: Publish to PyPI

# Trusted Publishing (OpenID Connect): no stored token. PyPI trusts this exact
# repository + workflow file + environment, and GitHub mints a short-lived identity
# token per run. Configure the publisher on PyPI as:
#   project sextant-ai, owner protechtus, repository sextant,
#   workflow publish.yml, environment pypi.
#
# Trigger: publishing a GitHub Release (tag like v0.1.0), or a manual dispatch that
# types the version. The build job needs no secrets and refuses to proceed unless the
# tag equals the package version and the full test suite passes on that tree; only the
# publish job holds the id-token permission, inside the "pypi" environment (protect it on GitHub
# with a required reviewer once the repository is public: an environment without rules is a name).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Type the version in pyproject.toml (e.g. 0.1.0) to confirm a manual publish"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Tag or typed version must equal the package version
        # A PyPI version can never be re-uploaded, so a tag that drifts from pyproject.toml
        # (v0.1.1 tag on a 0.1.0 tree) must fail here, not on PyPI (2026-11-09).
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}   # never interpolated into the script (MN4, 2026-11-11)
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ github.event_name }}" = "release" ]; then want="${GITHUB_REF_NAME#v}"; else want="$REQUESTED_VERSION"; fi
          echo "package=$pkg requested=$want"
          [ "$pkg" = "$want" ] || { echo "::error::version mismatch: package $pkg vs requested $want"; exit 1; }
      - name: Test suite must pass on the exact tree being published
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,telegram,summarizer]"
          ATLAS_SEMANTIC_SEARCH=off python -m pytest tests -q -p no:cacheprovider
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sextant-ai/
    permissions:
      id-token: write   # the OIDC token PyPI verifies; nothing else
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          print-hash: true

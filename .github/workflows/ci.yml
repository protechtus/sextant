name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        # One 3.12 lane (ubuntu only): validates the 3.12 classifier the
        # public pyproject claims without doubling macOS/windows minutes.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip setuptools
          python -m pip install -e ".[dev,telegram,summarizer]"
      - name: Test
        run: python -m pytest tests -q

  # Dependency CVEs: GATING since 2026-09-25 -- the tree audited clean
  # (only venv-bootstrap pip/setuptools findings, upgraded away), so per the
  # promote-once-quiet rule a new dependency CVE should be a red build.
  # Rollback if an upstream disclosure blocks urgent work: add
  # continue-on-error: true to this job.
  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip setuptools
          python -m pip install -e ".[telegram,summarizer]" pip-audit
      - name: pip-audit (dependency CVEs, gating)
        run: pip-audit

  # Advisory lane: informational only, never blocks the mainline.
  # bandit triaged 2026-09-27 (quality loop run 7): 7 findings -> 2 real
  # fixes (urlopen scheme allowlists), 1 proper fix (sha1
  # usedforsecurity=False), 3 documented nosec suppressions, 1 known
  # false positive that CANNOT carry a nosec marker (B608 misfires on the
  # dashboard's multiline HTML f-string; a marker on that line would be
  # emitted into the page). Stays advisory until that anchor is solvable.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip setuptools
          python -m pip install -e ".[telegram,summarizer]" bandit
      - name: bandit (static security scan, advisory)
        continue-on-error: true
        run: bandit -r src/atlas_plus -ll -q

  # P2 (Codex audits 2026-09-21): prove the SHIPPED artifact on every push --
  # rebuild the public tree (runs the identifier gate inside the builder),
  # build sdist+wheel from it, twine-check, and pin the public metadata.
  # GATING: a push that cannot produce a shippable package should be red.
  public-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build twine
      # In the PRIVATE repo the builder exists and produces the public tree (with its
      # identifier gate). In the PUBLIC repo the builder is intentionally absent, so the
      # checked-out tree IS the public tree. Either way the steps below build, check and
      # install a real artifact; nothing is skipped (Codex artifact audit 2026-11-09).
      - name: Choose the tree to package
        id: tree
        run: |
          if [ -f scripts/build_public_repo.py ]; then
            python scripts/build_public_repo.py --target /tmp/sextant-public --force
            echo "dir=/tmp/sextant-public" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi
      - name: Build sdist + wheel
        run: python -m build --outdir /tmp/dist "${{ steps.tree.outputs.dir }}"
      - name: twine check
        run: python -m twine check /tmp/dist/*
      - name: Verify wheel metadata and required data files
        run: |
          python - << 'PY'
          import glob, zipfile
          whl = glob.glob("/tmp/dist/*.whl")[0]
          z = zipfile.ZipFile(whl)
          names = z.namelist()
          meta = next(n for n in names if n.endswith("METADATA"))
          text = z.read(meta).decode()
          for needle in ("Name: sextant-ai", "License-Expression: Apache-2.0",
                         "Author: protechtus", "Requires-Python: >=3.11"):
              assert needle in text, f"missing from wheel METADATA: {needle}"
          for data in ("atlas_plus/summarizer/templates/session_log.md.j2",
                       "atlas_plus/summarizer/templates/updates_entry.txt.j2"):
              assert data in names, f"wheel is missing package data: {data}"
          print("wheel METADATA + package data ok")
          PY
      - name: Install the wheel outside the checkout and smoke it
        run: |
          python -m venv /tmp/consumer
          /tmp/consumer/bin/python -m pip install -q /tmp/dist/*.whl
          cd /tmp
          /tmp/consumer/bin/python -m atlas_plus --version
          /tmp/consumer/bin/python - << 'PY'
          from atlas_plus.summarizer.prompts import render_session_log, render_updates_entry
          # the keys the shipped templates read (summary.title/completed/pending/files_touched)
          summary = {"title": "smoke", "completed": ["built a wheel"], "pending": ["ship it"],
                     "files_touched": ["pyproject.toml"]}
          for fn in (render_session_log, render_updates_entry):
              out = fn(summary, "2026-01-01")
              assert isinstance(out, str) and "built a wheel" in out, (fn.__name__, out)
          print("installed summarizer templates render ok")
          PY
          ATLAS_MEMORY_ROOT=/tmp/smoke/memory ATLAS_STATE_DIR=/tmp/smoke/state /tmp/consumer/bin/python -m atlas_plus.init_cmd
          ATLAS_MEMORY_ROOT=/tmp/smoke/memory ATLAS_STATE_DIR=/tmp/smoke/state ATLAS_SEMANTIC_SEARCH=off /tmp/consumer/bin/python "${{ steps.tree.outputs.dir }}/scripts/mcp_roundtrip.py" --project ci
